spring.application.name=events-service
server.port=${PORT:3001}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

events.api-key=${API_KEY:}
events.comm-key=${EVENTS_COMM_KEY:}
events.supabase-url=${SUPABASE_URL:}

kafka.enabled=${KAFKA_ENABLED:false}
kafka.events-topic=${KAFKA_EVENTS_TOPIC:mini-crm.events}
kafka.events-consumer-group-id=${KAFKA_EVENTS_CONSUMER_GROUP_ID:events-service}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.consumer.group-id=${KAFKA_EVENTS_CONSUMER_GROUP_ID:events-service}
spring.kafka.consumer.auto-offset-reset=earliest
kafka.access-key=${KAFKA_ACCESS_KEY:}
kafka.access-certificate=${KAFKA_ACCESS_CERTIFICATE:}
kafka.ca-certificate=${KAFKA_CA_CERTIFICATE:}
